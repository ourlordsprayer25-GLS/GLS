      <stop offset="0%" stop-color="#1862ff" />
      <stop offset="100%" stop-color="#155dfc" />
    </linearGradient>
  </defs>

  <!-- Background Base: Seamless squircle app icon -->
  <rect width="512" height="512" rx="116" fill="url(#electricBlue)" />

