    <script>
      // Gracefully suppress Vite HMR connection warnings in preview iframe
      (() => {
        const origError = console.error;
        console.error = (...args) => {
          if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          origError.apply(console, args);
        };
      })();
    </script>

    <!-- PWA Dynamic Web App Manifest (Auto-switched for Storefront vs Admin) -->
    <link id="app-manifest" rel="manifest" href="/manifest-store.webmanifest" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var isAdmin = window.location.pathname.startsWith('/admin') || window.location.hash.includes('admin');
          var mLink = document.getElementById('app-manifest');
          if (mLink) {
            mLink.setAttribute('href', isAdmin ? '/manifest-admin.webmanifest' : '/manifest-store.webmanifest');
          }
          if (isAdmin) {
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', 'MY ADMIN');
          }
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              var isLocalhost = Boolean(
                window.location.hostname === 'localhost' ||
                window.location.hostname === '[::1]' ||
                window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
              );
              if (isLocalhost) {
                // In local development, unregister active service workers to prevent intercepting Vite dev server & HMR
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                  }
                });
              } else {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
              }
            });
          }
        }
      })();
    </script>
