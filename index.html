    <script>
      // Gracefully suppress Vite HMR connection warnings in preview iframe
      (() => {
        const origError = console.error;
        console.error = (...args) => {
          if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          origError.apply(console, args);
        };
      })();
